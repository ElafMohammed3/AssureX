{% extends "admin_Base.html" %}


{% block title %}
Warranty & Rule Parameters
{% endblock %}


{% block content %}
            <div class="content-card">
                <div class="section-header">
                    <h3 class="section-title">Category Warranty & Validation Rule Parameters</h3>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product Category</label>
                        <select>
                            <option>Consumer Electronics (TV, Audio)</option>
                            <option>Home Appliances (Washing Machine, Fridge)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Standard Warranty Period (Months)</label>
                        <input type="number" value="24">
                    </div>
                    <div class="form-group">
                        <label>Claim Reporting Deadline (Days after fault)</label>
                        <input type="number" value="30">
                    </div>
                    <div class="form-group">
                        <label>Confidence Disagreement Threshold (%)</label>
                        <input type="number" value="15.0">
                    </div>
                    <div class="form-group">
                        <label>Mandatory Documents Required</label>
                        <select>
                            <option>Receipt + Warranty Card + Serial Image</option>
                            <option>Receipt Only</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Auto-Approval Minimum Confidence (%)</label>
                        <input type="number" value="85">
                    </div>
                </div>
                <button class="btn-save">Save Warranty Policy Configurations</button>
            </div>
  {% endblock %}
