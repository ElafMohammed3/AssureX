<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssureX Claim Engine - Warranty Rules Configuration</title>
    <style>
        :root {
            --bg-body: #F4F3F5;
            --sidebar-bg: #2D080E;
            --primary-burgundy: #4A0E17;
            --accent-red: #801828;
            --card-bg: #FFFFFF;
            --text-dark: #1F1F1F;
            --text-muted: #6C757D;
            --border-radius: 18px;
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-dark); display: flex; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: #FFFFFF; display: flex; flex-direction: column; padding: 30px 20px; flex-shrink: 0; }
        .sidebar .brand { font-size: 24px; font-weight: bold; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; color: #FFFFFF; }
        .sidebar .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .sidebar .nav-item a { color: rgba(255, 255, 255, 0.7); text-decoration: none; padding: 14px 18px; border-radius: 12px; display: block; transition: all 0.3s ease; font-size: 15px; }
        .sidebar .nav-item.active a, .sidebar .nav-item a:hover { background-color: var(--primary-burgundy); color: #FFFFFF; font-weight: 600; }
        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-header { background-color: var(--card-bg); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .top-header .user-profile { display: flex; align-items: center; gap: 15px; }
        .top-header .avatar { width: 42px; height: 42px; border-radius: 50%; background-color: var(--primary-burgundy); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .content-area { padding: 35px 40px; display: flex; flex-direction: column; gap: 30px; }
        .section-header { margin-bottom: 15px; }
        .section-title { font-size: 20px; font-weight: 700; color: var(--primary-burgundy); }
        .content-card { background-color: var(--card-bg); border-radius: var(--border-radius); padding: 25px; box-shadow: var(--shadow-soft); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-dark); }
        .form-group input, .form-group select { padding: 12px 16px; border: 1px solid #E2E0E5; border-radius: 10px; background-color: #FAFAFA; font-size: 14px; outline: none; }
        .btn-save { background-color: var(--primary-burgundy); color: #FFFFFF; border: none; padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">AssureX Admin</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="#">Dashboard Overview</a></li>
            <li class="nav-item"><a href="#">All Claims Queue</a></li>
            <li class="nav-item"><a href="#">Manual Review Queue</a></li>
            <li class="nav-item active"><a href="#">Warranty Rules Config</a></li>
            <li class="nav-item"><a href="#">Analytics & Reports</a></li>
            <li class="nav-item"><a href="#">Audit Logs</a></li>
            <li class="nav-item"><a href="#">User Management</a></li>
        </ul>
    </aside>
    <div class="main-wrapper">
        <header class="top-header">
            <h2>Configurable Warranty Policies Engine</h2>
            <div class="user-profile">
                <div>
                    <div style="font-weight: bold;">Admin User</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Policy Configurator</div>
                </div>
                <div class="avatar">AD</div>
            </div>
        </header>
        <main class="content-area">
            <div class="content-card">
                <div class="section-header">
                    <h3 class="section-title">Category Warranty & Validation Rule Parameters</h3>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product Category</label>
                        <select>
                            <option>Consumer Electronics (TV, Audio)</option>
                            <option>Home Appliances (Washing Machine, Fridge)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Standard Warranty Period (Months)</label>
                        <input type="number" value="24">
                    </div>
                    <div class="form-group">
                        <label>Claim Reporting Deadline (Days after fault)</label>
                        <input type="number" value="30">
                    </div>
                    <div class="form-group">
                        <label>Confidence Disagreement Threshold (%)</label>
                        <input type="number" value="15.0">
                    </div>
                    <div class="form-group">
                        <label>Mandatory Documents Required</label>
                        <select>
                            <option>Receipt + Warranty Card + Serial Image</option>
                            <option>Receipt Only</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Auto-Approval Minimum Confidence (%)</label>
                        <input type="number" value="85">
                    </div>
                </div>
                <button class="btn-save">Save Warranty Policy Configurations</button>
            </div>
        </main>
    </div>
</body>
</html>
