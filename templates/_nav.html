
{#
  Shared AssureX navigation.

  This is a partial rather than a base layout because the dashboard templates
  are complete standalone HTML documents with their own <head> and <style>
  blocks. Including this file adds working navigation to each of them without
  restructuring or discarding their markup.

  Every link uses url_for(), so routes stay correct if a path ever changes.
#}
<nav class="ax-nav" style="
    background:#2D080E; color:#fff; padding:0 20px; display:flex;
  align-items:center; gap:22px; flex-wrap:wrap;
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  border-bottom:3px solid #801828; margin-bottom:0;
  flex:0 0 100%; width:100%; box-sizing:border-box; align-self:flex-start; align-self:flex-start; 
">
  <a href="{{ url_for('index') }}" style="
      color:#fff; text-decoration:none; font-weight:700; font-size:17px;
      letter-spacing:.4px; padding:14px 0; display:inline-block;
  ">ASSUREX</a>

  <a href="{{ url_for('customer_dashboard') }}" style="
      color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      border-bottom:2px solid transparent;
  ">Dashboard</a>

  <a href="{{ url_for('create_claim') }}" style="
      color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      border-bottom:2px solid transparent;
  ">New Claim</a>

  <a href="{{ url_for('claims_queue') }}" style="
      color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      border-bottom:2px solid transparent;
  ">All Claims</a>

  <a href="{{ url_for('my_products') }}" style="
      color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      border-bottom:2px solid transparent;
  ">Products</a>

  <a href="{{ url_for('claim_status') }}" style="
      color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      border-bottom:2px solid transparent;
  ">Claim Status</a>

  <a href="{{ url_for('receipt_vault') }}" style="
      color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      border-bottom:2px solid transparent;
  ">Documents</a>

  {% if current_user %}
    {% if current_user.role in ['Claim reviewer', 'Administrator'] %}
      <a href="{{ url_for('manual_review_queue') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
          border-bottom:2px solid transparent;
      ">Manual Review</a>

      <a href="{{ url_for('warranty_rules_config') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
          border-bottom:2px solid transparent;
      ">Warranty Rules</a>

      <a href="{{ url_for('analytics_reports') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
          border-bottom:2px solid transparent;
      ">Analytics</a>
    {% endif %}

    {% if current_user.role == 'Administrator' %}
      <a href="{{ url_for('admin_dashboard') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
          border-bottom:2px solid transparent;
      ">Admin</a>

      <a href="{{ url_for('audit_logs') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
          border-bottom:2px solid transparent;
      ">Audit</a>

      <a href="{{ url_for('user_management') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
          border-bottom:2px solid transparent;
      ">Users</a>
    {% endif %}

    <span style="margin-left:auto;display:flex;align-items:center;gap:14px;">
      <span style="color:#8b949e;font-size:13px;">
        {{ current_user.full_name }} &middot; {{ current_user.role }}
      </span>
      <a href="{{ url_for('profile') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      ">Profile</a>
      <a href="{{ url_for('logout') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      ">Sign out</a>
    </span>
  {% else %}
    <span style="margin-left:auto;display:flex;gap:14px;">
      <a href="{{ url_for('login') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      ">Sign in</a>
      <a href="{{ url_for('register') }}" style="
          color:#EDE7E9; text-decoration:none; font-size:14px; padding:14px 0;
      ">Register</a>
    </span>
  {% endif %}
</nav>
